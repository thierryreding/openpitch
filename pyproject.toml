[project]
name = "openpitch"
version = "0.1.0.dev0"
description = "Football video tools for amateur coaches: clipping, detection, tracking and pitch analysis"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Thierry Reding", email = "thierry@gilfi.de" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Keep base dependencies minimal: this is what core + cli need on a coach laptop.
dependencies = [
    "av>=14",
    "click>=8.1",
    "numpy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# PySide6 is LGPL; only openpitch.studio may import it.
studio = ["pyside6>=6.8"]
# Inference stack for dev workstations (and later Jetson). Ultralytics is AGPL-3.0
# and stays behind the detector backend abstraction (docs/decisions/0007).
gpu = [
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.3",
]

[project.scripts]
openpitch = "openpitch.cli:main"

[project.gui-scripts]
openpitch-studio = "openpitch.studio:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpitch"]

# CUDA wheels for torch on Linux x86_64 and Windows; other platforms use PyPI.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not gpu"]
markers = [
    "gpu: needs a CUDA-capable GPU and the gpu extra (deselected by default; run with -m gpu)",
]
