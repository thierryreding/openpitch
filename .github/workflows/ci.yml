name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  test:
    # No GPU on hosted runners: this is the no-GPU test run (gpu tests are deselected by default).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install core + cli + studio (no gpu extra, as in the coach build)
        run: uv sync --locked --extra studio
      - run: uv run --locked pytest
      - name: Studio imports PySide6
        run: uv run --locked python -c "import PySide6.QtWidgets"

  # Coach installers (PyInstaller / pyside6-deploy / Briefcase) come later; see docs/issues.
